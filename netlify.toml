# Netlify configuration for halqa.ly
# Only used for git-connected deploys. A drag-and-drop deploy ignores this
# file, so if you deploy by dragging the folder you simply lose the caching
# and security headers below — nothing breaks.

[build]
  publish = "."

# ---------------------------------------------------------------------------
# Security headers, applied to everything
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------------------------------------------------------------------------
# Caching
# Fonts get a year: the filenames never change and neither do the files.
# Images get a week, because you will be swapping photos in under the same
# filenames and a year-long cache would leave old visitors on old photos.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
